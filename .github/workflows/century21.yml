name: Scrape agences Century 21

on:
  workflow_dispatch:        # lancement manuel depuis l'onglet Actions
  schedule:
    - cron: "0 5 1 * *"     # optionnel : le 1er de chaque mois à 05:00 UTC

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer le scraper
        run: python scrape_century21.py

      - name: Publier le fichier xlsx
        uses: actions/upload-artifact@v4
        with:
          name: century21-agences
          path: century21_agences.xlsx
          if-no-files-found: error
